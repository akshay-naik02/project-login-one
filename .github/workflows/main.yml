name: Build WAR File

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Check Maven version
        run: mvn -version

      - name: Build WAR using Maven
        run: mvn clean package

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: war-file
          path: target/*.war
          
      - name: Build Docker Image
        run: |
          docker build -t project-login-one:latest .

      - name: Docker Image List
        run: docker images

            # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag Docker Image
      - name: Tag Docker Image for Docker Hub
        run: |
          docker tag project-login-one:latest ${{ secrets.DOCKERHUB_USERNAME }}/project-login-one:latest

      # Push Docker Image
      - name: Push Docker Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/project-login-one:latest

